# SonarQube Configuration
# https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters/

sonar.projectKey=unicorn
sonar.projectName=Unicorn Framework
sonar.projectVersion=1.0.0

# Source configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts

# TypeScript/JavaScript configuration
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Coverage exclusions (don't count these in coverage metrics)
sonar.coverage.exclusions=**/*.test.ts,**/index.ts,src/sentry.ts

# Duplication exclusions
sonar.cpd.exclusions=**/*.test.ts
