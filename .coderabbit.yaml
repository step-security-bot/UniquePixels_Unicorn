# CodeRabbit Configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit

language: en-US
early_access: true
reviews:
  profile: assertive
  request_changes_workflow: true
  review_details: true
  fail_commit_status: true
  suggested_labels: false
  poem: false
  pre_merge_checks:
    docstrings:
      mode: error

  # Review hints to focus on
  path_instructions:
    - path: "src/core/**"
      instructions: |
        This is core framework code. Focus on:
        - Type safety and proper TypeScript patterns
        - Error handling robustness
        - API design consistency
        - Performance implications

    - path: "src/guards/**"
      instructions: |
        Guards are validation functions. Ensure:
        - Proper type narrowing
        - Clear error messages in GuardResult
        - No side effects

    - path: "src/sparks/**"
      instructions: |
        Sparks are modular handlers. Check:
        - Consistent patterns with other sparks
        - Proper error handling in actions
        - Guard usage where appropriate

    - path: "**/*.test.ts"
      instructions: |
        Test files. Verify:
        - Meaningful test descriptions
        - Edge cases covered
        - No flaky patterns

    - path: "**/.claude/**"
      instructions: |
        Configuration files for Claude. Ensure:
        - No sensitive information
        - Proper formatting
        - Optimized for context window and token use

issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    auto_planning:
      labels:
        - '!no-plan'
