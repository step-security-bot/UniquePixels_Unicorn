# Coverage thresholds are also enforced by Bun's test runner (see bunfig.toml).
# The patch-lcov script ensures all source files appear in coverage reports.
coverage:
  status:
    project:
      default:
        target: 90%
    patch:
      default:
        target: 90%

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  require_changes: true

ignore:
  - "src/**/__test_sparks__/**"
  - "src/core/lib/test-helpers/**"
  - "src/**/*.test.ts"
  - "src/**/*.d.ts"
